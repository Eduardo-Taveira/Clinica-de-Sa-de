services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: clinica_agendamentos
      POSTGRES_USER: clinica_user
      POSTGRES_PASSWORD: clinica_password
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - clinica_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clinica_user -d clinica_agendamentos"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  clinica_postgres_data:
